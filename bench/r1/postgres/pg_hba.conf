# Managed R1 pg_hba.  Basebackups arrive from the Docker bridge gateway
# (172.18.0.1) because of the port NAT, so replication must be allowed
# beyond loopback.  Application connections keep password auth.
local   all             all                                     trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
